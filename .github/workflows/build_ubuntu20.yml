name: main_build_ubuntu22.04
on:
  push:
    branches:
      - 'main'
      - '28input'
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build inside Ubuntu 22.04 container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            ubuntu:22.04 \
            bash -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -y \
                build-essential curl wget file pkg-config \
                libwebkit2gtk-4.0-dev \
                libgtk-3-dev \
                libappindicator3-dev \
                librsvg2-dev \
                patchelf \
                libsoup2.4-dev \
                libjavascriptcoregtk-4.0-dev \
                libssl-dev \
                libudev-dev \
                libglib2.0-dev \
                libgdk-pixbuf2.0-dev \
                libpango1.0-dev \
                libcairo2-dev \
                libatk1.0-dev \
              && export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig \
              && curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
              && export PATH="/root/.cargo/bin:$PATH" \
              && curl -fsSL https://deb.nodesource.com/setup_20.x | bash - \
              && apt-get install -y nodejs \
              && npm install \
              && npm install -D @tauri-apps/cli@latest \
              && npx tauri build
            '

      - name: Read release notes
        id: read-notes
        shell: bash
        run: |
          DATE=$(date +'%Y年%m月%d日')
          NOTES=$(cat .github/workflows/markdown/release.md)
          NOTES=${NOTES//__DATE__/$DATE}
          NOTES=${NOTES//%/%25}
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ubuntu22-build-${{ github.run_id }}
          releaseName: 'Ubuntu 22.04 Build ${{ github.run_id }}'
          releaseBody: ${{ steps.read-notes.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: ''

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle-ubuntu22
          path: src-tauri/target/release/bundle/*